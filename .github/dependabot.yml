version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: monthly }
    groups:
      ui: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /core
    schedule: { interval: monthly }
    groups:
      core: { patterns: ["*"] }
