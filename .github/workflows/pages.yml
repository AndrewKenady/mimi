name: Deploy site to GitHub Pages

# The landing page, case study and scoreboard (site/) plus the live demo: the real Mimi UI built
# with a recorded Core (npm run build:demo), published at /mimi/demo/. The scoreboard reads the
# eval reports committed to eval/reports/ (eval/publish.py).
on:
  push:
    branches: [main]
    paths: ["site/**", "ui/**", "eval/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the live demo
        working-directory: ui
        run: npm ci && npm run build:demo
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r ui/build-demo _site/demo
          python3 eval/publish.py _site/scoreboard
          du -sh _site _site/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
