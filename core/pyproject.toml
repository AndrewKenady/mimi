[project]
name = "mimi"
version = "0.1.0"
description = "Mimi — Machine Intelligence, Minus the Internet. The offline AI field station."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Kenady and Mimi contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart",
  "psutil",
  "numpy",
  "orjson",
  "pypdf",
  "python-docx",
  "selectolax",
  "zeroconf",
  "cryptography",
  "qrcode",
  "pyserial",
  "pillow",
  "faster-whisper",
  "kokoro-onnx",
  "rapidocr",
  "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest", "huggingface_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mimi"]
