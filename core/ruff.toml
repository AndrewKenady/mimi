# Lint gate run by CI (.github/workflows/ci.yml). Deliberately focused on
# real bugs rather than style: undefined names, unused imports and
# variables, syntax errors, and the bugbear checks that catch logic slips.
line-length = 160
target-version = "py311"
extend-include = ["../scripts/*.py", "../tools/*.py", "../eval/*.py"]

[lint]
select = ["E9", "F", "B", "UP0", "RUF100"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() in defaults is the framework's idiom
  "B905",  # zip() without strict= is fine for our same-length pairs
  "UP006", "UP007", "UP035", "UP045",  # keep the existing annotation style
]

[lint.per-file-ignores]
"tests/*" = ["B011", "B017"]
