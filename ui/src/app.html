<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#070b12" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="MIMI — Machine Intelligence, Minus the Internet" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<title>MIMI</title>
		<style>
			html,body{margin:0;background:#070b12;color:#e7edf6}
			#boot{position:fixed;inset:0;display:grid;place-items:center}
			#boot i{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#d9fff8 0,#6ee7d2 22%,#1e8f8a 48%,#0b2f3c 72%,transparent 74%);box-shadow:0 0 70px rgba(110,231,210,.35);animation:b 2.4s ease-in-out infinite}
			@keyframes b{50%{transform:scale(1.06);box-shadow:0 0 110px rgba(110,231,210,.5)}}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot"><i></i></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
